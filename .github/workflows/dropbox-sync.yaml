name: Dropbox to GitHub Auto-Deploy

on:
  schedule:
    - cron: '*/10 * * * *'  # Runs automatically every 10 minutes
  workflow_dispatch:        # Allows manual 1-click runs anytime under Actions tab

jobs:
  sync-dropbox:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Latest Files from Dropbox
        env:
          DROPBOX_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
        run: |
          echo "Downloading files from /Drew-main/Drew-main..."
          HTTP_STATUS=$(curl -s -w "%{http_code}" -X POST https://content.dropboxapi.com/2/files/download_zip \
            --header "Authorization: Bearer $DROPBOX_TOKEN" \
            --header "Dropbox-API-Arg: {\"path\": \"/clearfaultlegal\"}" \
            --output site_files.zip)

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Dropbox API error: HTTP $HTTP_STATUS"
            cat site_files.zip
            exit 1
          fi

          echo "Extracting files to repository root..."
          unzip -o site_files.zip -d ./
          rm site_files.zip

      - name: Commit and Push Updates
        run: |
          git config --global user.name "ClearFault Deployer"
          git config --global user.email "contact@clearfaultlegal.com"
          git add -A
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "Auto-sync site assets from Dropbox [skip ci]"
            git push origin main
            echo "Pushed changes to GitHub. Vercel deployment triggered."
          fi
